<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JapanFun - 日本全國隨機地圖選取器</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛩️</text></svg>">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="navbar">
            <h1>⛩️ JapanFun 日本全國隨機地圖選取器</h1>
            <div class="navbar-stats">總區域：<span id="total-areas">—</span></div>
            <button id="theme-toggle" class="btn-theme-toggle" type="button" title="切換淺色／深色主題">🌙 深色</button>
        </header>

        <div class="main-content">
            <div class="map-wrap">
                <div id="map"></div>
                <div id="roulette-banner" class="roulette-banner hidden" aria-live="polite">
                    <span class="roulette-icon">🎲</span>
                    <span id="roulette-text">準備抽選⋯</span>
                </div>
                <div class="map-legend">
                    <span class="legend-anchor">▬ 基地縣界</span>
                    <span class="legend-pool">▬ 鄰縣／抽選範圍</span>
                    <span class="legend-selected">■ 已選取</span>
                </div>
                <div id="loading-overlay">
                    <div class="spinner"></div>
                    <p>載入行政區邊界資料中⋯</p>
                </div>
            </div>

            <!-- 指示輔助虛線 SVG 圖層（連接右側已選卡片與地圖區域中心） -->
            <svg id="leader-lines-svg" class="leader-lines-svg" aria-hidden="true"></svg>

            <!-- 左側懸浮：區域資訊區塊（點選區域時顯示） -->
            <aside id="info-panel" class="floating-panel info-panel hidden" aria-label="區域資訊區塊"></aside>

            <!-- 右側懸浮：上下分割為「隨機功能區」與「已選取區域清單」 -->
            <div class="floating-right">
                <section id="control-panel" class="floating-panel control-panel">
                    <button id="toggle-control-panel" class="panel-collapse-header" type="button" aria-expanded="true">
                        <span class="collapse-title">🎲 隨機選取設定</span>
                        <span id="filter-scope-badge" class="scope-badge">全日本</span>
                        <span id="control-collapse-arrow" class="collapse-arrow">▲</span>
                    </button>

                    <div id="control-panel-body" class="panel-body">
                        <div class="control-subblock filter-section">
                            <div class="section-header">
                                <span class="label">篩選縣市（點選設定基地縣）</span>
                                <button id="reset-filter" class="btn-reset" type="button">初始化</button>
                            </div>
                            <div id="prefecture-chips"></div>
                        </div>

                        <div class="control-subblock action-section">
                            <div class="label">抽選條件與數量</div>
                            <div class="draw-options-row">
                                <button id="toggle-draw-scope" class="option-pill" type="button" title="切換抽籤範圍模式：單一縣市／包含相鄰縣市／全日本">
                                    🎯 僅限基地縣
                                </button>
                                <button id="toggle-include-islands" class="option-pill" type="button" title="是否納入小笠原諸島、伊豆諸島等需乘船／搭機之偏遠離島">
                                    ✕ 排除偏遠離島
                                </button>
                            </div>
                            <div class="controls-row">
                                <input type="number" id="count" min="1" max="50" value="5">
                                <button id="random-select" class="btn-primary" type="button">隨機選取</button>
                            </div>
                            <button id="clear-selection" class="btn-ghost" type="button">清除選取</button>
                        </div>
                    </div>
                </section>

                <section id="results-panel" class="floating-panel results-panel">
                    <div class="results-header">
                        <span class="label">已選取 <strong id="selected-count">0</strong> 個區域</span>
                        <span class="results-subhint">點選注目／再點取消</span>
                    </div>
                    <div id="selected-areas"></div>
                </section>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/data.js"></script>
    <script src="js/map.js"></script>
    <script src="js/info-panel.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
