<h2>版面配置方式</h2>
<p class="subtitle">決定地圖與控制面板的空間關係</p>

<div class="cards">
  <div class="card" data-choice="fullscreen" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#0d1117; border-radius:8px; padding:12px; min-height:180px; font-family:monospace; font-size:10px; position:relative; overflow:hidden;">
      <!-- Map full screen -->
      <div style="position:absolute; inset:0; background:linear-gradient(135deg,#101820 0%,#152033 100%); border-radius:8px;"></div>
      <!-- Fake map grid -->
      <div style="position:absolute; inset:0; opacity:0.15; background-image: repeating-linear-gradient(0deg,#4a9eff 0,#4a9eff 1px,transparent 1px,transparent 40px), repeating-linear-gradient(90deg,#4a9eff 0,#4a9eff 1px,transparent 1px,transparent 40px);"></div>
      <!-- Floating control panel top-left -->
      <div style="position:absolute; top:10px; left:10px; background:rgba(13,17,23,0.85); border:1px solid #2d4a7a; border-radius:8px; padding:8px 12px; backdrop-filter:blur(8px); z-index:2;">
        <div style="color:#74b9ff; font-size:9px; font-weight:700; margin-bottom:6px; letter-spacing:0.1em;">東京首都圈選取器</div>
        <div style="display:flex; gap:6px; align-items:center;">
          <div style="background:#1a2535; border:1px solid #2d4a7a; border-radius:4px; color:#94a3b8; font-size:9px; padding:3px 8px;">5</div>
          <div style="background:#3b82f6; color:#fff; font-size:9px; padding:3px 10px; border-radius:4px;">隨機選取</div>
          <div style="background:#1a2535; border:1px solid #374151; color:#94a3b8; font-size:9px; padding:3px 8px; border-radius:4px;">清除</div>
        </div>
      </div>
      <!-- Floating results panel bottom-left -->
      <div style="position:absolute; bottom:10px; left:10px; background:rgba(13,17,23,0.85); border:1px solid #2d4a7a; border-radius:8px; padding:8px 12px; backdrop-filter:blur(8px); z-index:2; max-width:160px;">
        <div style="color:#94a3b8; font-size:8px; margin-bottom:5px;">已選取 3 個區域</div>
        <div style="display:flex; gap:4px; flex-wrap:wrap;">
          <span style="background:#ff6b6b22; border:1px solid #ff6b6b55; color:#ff6b6b; padding:1px 6px; border-radius:10px; font-size:8px;">新宿區</span>
          <span style="background:#ff6b6b22; border:1px solid #ff6b6b55; color:#ff6b6b; padding:1px 6px; border-radius:10px; font-size:8px;">澀谷區</span>
          <span style="background:#ff6b6b22; border:1px solid #ff6b6b55; color:#ff6b6b; padding:1px 6px; border-radius:10px; font-size:8px;">港區</span>
        </div>
      </div>
      <!-- Map polygons hint -->
      <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#2d4a7a; font-size:10px; opacity:0.6;">🗾 全螢幕地圖</div>
    </div>
    <div class="card-body">
      <h3>全螢幕地圖＋浮動面板</h3>
      <p>地圖佔滿整個畫面，控制與結果以半透明卡片浮在地圖上方。視覺最震撼，地圖空間最大</p>
    </div>
  </div>

  <div class="card" data-choice="sidebar" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#0d1117; border-radius:8px; padding:0; min-height:180px; display:flex; overflow:hidden;">
      <!-- Left: map -->
      <div style="flex:1.6; background:linear-gradient(135deg,#101820 0%,#152033 100%); position:relative; overflow:hidden;">
        <div style="position:absolute; inset:0; opacity:0.12; background-image: repeating-linear-gradient(0deg,#4a9eff 0,#4a9eff 1px,transparent 1px,transparent 30px), repeating-linear-gradient(90deg,#4a9eff 0,#4a9eff 1px,transparent 1px,transparent 30px);"></div>
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#2d4a7a; font-size:10px; opacity:0.6;">🗾 地圖</div>
        <!-- fake polygon -->
        <div style="position:absolute; top:30%; left:35%; width:30px; height:22px; background:#ff6b6b33; border:1px solid #ff6b6b88; border-radius:3px;"></div>
        <div style="position:absolute; top:45%; left:50%; width:22px; height:18px; background:#ff6b6b22; border:1px solid #ff6b6b55; border-radius:3px;"></div>
      </div>
      <!-- Right: sidebar -->
      <div style="width:120px; background:#0d1117; border-left:1px solid #1e2d3d; padding:10px; display:flex; flex-direction:column; gap:8px;">
        <div style="color:#74b9ff; font-size:8px; font-weight:700; letter-spacing:0.08em;">選取器</div>
        <div style="display:flex; gap:4px;">
          <div style="background:#1a2535; border:1px solid #2d4a7a; border-radius:3px; color:#94a3b8; font-size:8px; padding:2px 5px; width:24px; text-align:center;">5</div>
          <div style="background:#3b82f6; color:#fff; font-size:7px; padding:2px 5px; border-radius:3px; flex:1; text-align:center;">隨機</div>
        </div>
        <div style="background:#1a2535; border:1px solid #374151; color:#94a3b8; font-size:7px; padding:2px 5px; border-radius:3px; text-align:center;">清除選取</div>
        <div style="border-top:1px solid #1e2d3d; padding-top:6px;">
          <div style="color:#64748b; font-size:7px; margin-bottom:4px;">已選取 2 個</div>
          <div style="display:flex; flex-direction:column; gap:3px;">
            <div style="background:#1a2535; border-left:2px solid #ff6b6b; padding:3px 5px; border-radius:2px; color:#e2e8f0; font-size:7px;">新宿區</div>
            <div style="background:#1a2535; border-left:2px solid #ff6b6b; padding:3px 5px; border-radius:2px; color:#e2e8f0; font-size:7px;">澀谷區</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>側邊欄佈局</h3>
      <p>地圖佔左側 60–65%，右側固定側欄放控制與結果列表。操作直覺，適合同時看地圖與清單</p>
    </div>
  </div>

  <div class="card" data-choice="stacked" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#0d1117; border-radius:8px; padding:10px; min-height:180px; display:flex; flex-direction:column; gap:6px; overflow:hidden;">
      <!-- Top bar -->
      <div style="background:#111827; border:1px solid #1e2d3d; border-radius:6px; padding:6px 10px; display:flex; align-items:center; gap:8px;">
        <span style="color:#74b9ff; font-size:8px; font-weight:700; flex:1;">東京首都圈選取器</span>
        <div style="background:#1a2535; border:1px solid #2d4a7a; border-radius:3px; color:#94a3b8; font-size:7px; padding:2px 5px;">5</div>
        <div style="background:#3b82f6; color:#fff; font-size:7px; padding:2px 7px; border-radius:3px;">隨機選取</div>
        <div style="background:#1a2535; border:1px solid #374151; color:#94a3b8; font-size:7px; padding:2px 5px; border-radius:3px;">清除</div>
      </div>
      <!-- Map -->
      <div style="flex:1; background:linear-gradient(135deg,#101820 0%,#152033 100%); border-radius:6px; position:relative; overflow:hidden; min-height:80px;">
        <div style="position:absolute; inset:0; opacity:0.12; background-image: repeating-linear-gradient(0deg,#4a9eff 0,#4a9eff 1px,transparent 1px,transparent 25px), repeating-linear-gradient(90deg,#4a9eff 0,#4a9eff 1px,transparent 1px,transparent 25px);"></div>
        <div style="position:absolute; top:30%; left:30%; width:25px; height:18px; background:#ff6b6b33; border:1px solid #ff6b6b88; border-radius:3px;"></div>
        <div style="position:absolute; top:42%; left:48%; width:20px; height:15px; background:#74b9ff22; border:1px solid #74b9ff55; border-radius:3px;"></div>
      </div>
      <!-- Bottom results -->
      <div style="background:#111827; border:1px solid #1e2d3d; border-radius:6px; padding:6px 10px;">
        <div style="color:#64748b; font-size:7px; margin-bottom:4px;">選取結果</div>
        <div style="display:flex; gap:4px; flex-wrap:wrap;">
          <span style="background:#ff6b6b22; border:1px solid #ff6b6b55; color:#ff6b6b; padding:1px 5px; border-radius:8px; font-size:7px;">新宿區</span>
          <span style="background:#ff6b6b22; border:1px solid #ff6b6b55; color:#ff6b6b; padding:1px 5px; border-radius:8px; font-size:7px;">澀谷區</span>
          <span style="background:#ff6b6b22; border:1px solid #ff6b6b55; color:#ff6b6b; padding:1px 5px; border-radius:8px; font-size:7px;">港區</span>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>上下堆疊佈局</h3>
      <p>頂部工具列、中間全寬地圖、底部結果列。目前網站的改良版，手機適應性最好</p>
    </div>
  </div>
</div>
