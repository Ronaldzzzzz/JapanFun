name = "japanfun"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

# Cloudflare D1 資料庫綁定
[[d1_databases]]
binding = "DB"
database_name = "japanfun-db"
database_id = "2a721d9c-030c-4d20-900b-194f717f209d"

# Cloudflare R2 圖床儲存桶綁定
[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "japanfun-photos"
